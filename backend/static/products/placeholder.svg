<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-label="A new Shopwise piece">
  <defs>
    <linearGradient id="bg999" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8DEE2"/>
      <stop offset="100%" stop-color="#F4F7F8"/>
    </linearGradient>
    <filter id="grain999">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <filter id="soft999"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#bg999)"/>
  <circle cx="351" cy="238" r="116" fill="#6D7D88" opacity=".16" filter="url(#soft999)"/>
